name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # API 키는 빌드 시점에 코드로 주입한다(--dart-define).
      # Secrets가 없으면 빈 값 → 샘플(목업) 모드로 안전하게 배포.
      - name: Build web
        run: |
          flutter build web --release --base-href /tideup/ \
            --dart-define=DATA_GO_KR_KEY="${{ secrets.DATA_GO_KR_KEY }}" \
            --dart-define=KAKAO_REST_KEY="${{ secrets.KAKAO_REST_KEY }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
