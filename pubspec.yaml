name: bitewind
description: "BiteWind - 낚시인을 위한 물때·바다날씨 앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  intl: ^0.20.0
  klc: ^0.1.0
  flutter_map: ^8.0.0
  latlong2: ^0.9.0
  url_launcher: ^6.3.0
  geolocator: ^13.0.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# 스플래시 화면 설정 (dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#0B3B66"
  image: assets/icon/tideup_fg.png
  android_12:
    color: "#0B3B66"
    image: assets/icon/tideup_fg.png

# 앱 런처 아이콘 생성 설정 (dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "assets/icon/tideup_icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "assets/icon/tideup_bg.png"
  adaptive_icon_foreground: "assets/icon/tideup_fg.png"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/tideup_icon.png"
    background_color: "#0B3B66"
    theme_color: "#0B3B66"

flutter:
  uses-material-design: true

  assets:
    - assets/config/
    - assets/geo/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
